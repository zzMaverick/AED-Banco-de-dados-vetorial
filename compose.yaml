services:
  app:
    build: .
    environment:
      ESTADO_DIR: /estado
      # Variável para sua aplicação saber onde o Qdrant está:
      QDRANT_HOST: http://qdrant:6333 
    volumes:
      - estado_vetorial:/estado
      - ./dados:/app/dados:ro
      - ./evidencias:/app/evidencias
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # Porta para acessar o Dashboard no seu navegador local
      - "6334:6334" # Porta gRPC (se sua aplicação usar)
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  estado_vetorial:
  qdrant_data: # Volume para não perder os dados do Qdrant ao reiniciar
