services:
  app:
    build: .
    environment:
      ESTADO_DIR: /estado
      QDRANT_HOST: http://qdrant:6333
    volumes:
      - estado_vetorial:/estado
      - ./dados:/app/dados
      - ./evidencias:/app/evidencias
    depends_on:
      - qdrant

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ESTADO_DIR: /estado
      QDRANT_HOST: http://qdrant:6333
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - estado_vetorial:/estado
      - ./dados:/app/dados
      - ./evidencias:/app/evidencias
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  estado_vetorial:
  qdrant_data:
